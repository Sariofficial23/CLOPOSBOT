# Local development stack: PostgreSQL + backend + report worker + frontend.
#   cp .env.example .env   (fill JWT_SECRET, ENCRYPTION_KEY, optionally TELEGRAM_BOT_TOKEN)
#   docker compose up --build
#   docker compose exec api npx tsx prisma/seed.ts     # optional: demo company + admin@example.com
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clopos
      POSTGRES_PASSWORD: clopos
      POSTGRES_DB: clopos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clopos -d clopos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgresql://clopos:clopos@db:5432/clopos
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:3001
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://clopos:clopos@db:5432/clopos
    command: ["node", "dist/worker/scheduled-reports.js", "--loop"]
    depends_on:
      api:
        condition: service_started
    profiles: ["worker"] # needs TELEGRAM_BOT_TOKEN: docker compose --profile worker up

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
