name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clopos
          POSTGRES_PASSWORD: clopos
          POSTGRES_DB: clopos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clopos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://clopos:clopos@localhost:5432/clopos_test
      DATABASE_URL: postgresql://clopos:clopos@localhost:5432/clopos_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @cpos/api build
      - run: pnpm --filter @cpos/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
